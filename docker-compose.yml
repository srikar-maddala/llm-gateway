services:
  redis:
    image: redis:7

  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_HOST: redis
      OLLAMA_API_BASE: http://host.docker.internal:11434
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
