models:
  fast:
    provider: groq
    litellm_model: groq/openai/gpt-oss-20b
    
    fallbacks : [smart,local]


  smart:
    provider: openai
    litellm_model: openai/gpt-4o-mini
    
    fallbacks : [fast,local]

  local:
    provider: ollama
    litellm_model: ollama/llama3.2
    api_base: http://localhost:11434
    fallbacks : [fast]
